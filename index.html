
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Battle Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h1>⚡ Quiz Battle</h1>
        <p>Test your knowledge and beat your score!</p>

        <div id="quiz-box">
            <h2 id="question">Your question will appear here</h2>

            <div id="answer-buttons">
                <button class="answer-btn">Option A</button>
                <button class="answer-btn">Option B</button>
                <button class="answer-btn">Option C</button>
                <button class="answer-btn">Option D</button>
            </div>

            <p id="result"></p>
            <button id="next-btn">Next Question</button>
        </div>

        <p id="score">Score: 0</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
